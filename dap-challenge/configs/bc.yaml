dataset:
  root: dap-challenge/data
  validation_fraction: 0.2

preprocessing:
  image_width: 224
  image_height: 168

model:
  history_length: 3

training:
  batch_size: 32
  max_epochs: 50
  seed: 42

  evaluation:
    every_steps: 100
    at_end: true

  checkpoint:
    every_steps: 1

  activity:
    motion_threshold: 0.01
    window_half_s: 0.1

  loss:
    endpoint_epsilon: 0.0001
    waiting_weight: 1.0
    non_waiting_weight: 2.0

  optimizer:
    learning_rate: 0.0003
    weight_decay: 0.0001
    max_gradient_norm: 1.0

wandb:
  project: robot-arm
  entity: ryanamiri05-northeastern-university
  name: dap-bc-waiting1-active2
  mode: online
